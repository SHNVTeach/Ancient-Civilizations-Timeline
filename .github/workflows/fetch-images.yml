name: Fetch timeline images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/images.json
      - tools/fetch_images.py
      - .github/workflows/fetch-images.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0 requests==2.32.3
      - run: python tools/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Bundle timeline images"
          git push
