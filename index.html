<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rivers of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: a fixed header over a two-axis scroller; time runs down, civilizations run across. */
  :root{
    --bg:#100e0b;
    --panel:#1c1712;
    --panel2:#221b15;
    --gold:#e8c05a;
    --gold-dim:#b7954a;
    --ink:#efe6d4;
    --muted:#9a8f7c;
    --line:rgba(232,192,90,.22);
    --line-soft:rgba(232,192,90,.10);
    --shade:rgba(16,14,11,.82);
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --head-h:60px;
    --ruler-w:78px;
    --ease:cubic-bezier(.2,.7,.2,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1e1812 0%, var(--bg) 60%) var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
  }
  #bg{position:fixed;inset:0;z-index:0;display:block}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- Top bar ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:40;
    background:linear-gradient(180deg, rgba(16,14,11,.96), rgba(16,14,11,.80) 70%, rgba(16,14,11,0));
    padding:calc(14px + env(safe-area-inset-top,0px)) 22px 26px;
    backdrop-filter:blur(3px);
  }
  .title-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .collapse-btn{
    margin-left:12px;align-self:center;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--gold-dim);
    border-radius:16px;padding:5px 13px;font-size:11.5px;cursor:pointer;letter-spacing:.06em;
    transition:.15s;white-space:nowrap;font-family:var(--sans);
  }
  .collapse-btn:hover{border-color:var(--gold);color:var(--gold)}
  body.controls-hidden .controls{display:none}
  h1{
    font-family:var(--serif);
    font-weight:600;font-size:26px;letter-spacing:.02em;margin:0;
    color:var(--gold);
  }
  h1 .sub{color:var(--muted);font-size:14px;font-family:var(--sans);font-weight:300;letter-spacing:.14em;text-transform:uppercase;margin-left:6px}
  .controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .chip-wrap{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:20px;
    padding:5px 12px 5px 9px;font-size:12.5px;cursor:pointer;
    color:var(--muted);background:rgba(255,255,255,.02);
    transition:background .25s ease, color .25s ease, transform .2s var(--ease);user-select:none;white-space:nowrap;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}
  .chip:hover{border-color:var(--gold-dim);color:var(--ink)}
  .chip:active{transform:scale(.95)}
  .chip.on{color:#160f06;font-weight:600;border-color:transparent}
  .btn{
    border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;transition:.15s;letter-spacing:.03em;font-family:var(--sans);
  }
  .btn:hover{border-color:var(--gold-dim);color:var(--ink)}
  .zoom{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}
  .zoom input{accent-color:var(--gold);cursor:pointer}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--gold)}
  .sep{width:1px;height:22px;background:var(--line-soft)}

  /* ---------- Era readout (lives in the header, never over content) ---------- */
  #era{
    margin-left:auto;align-self:center;display:flex;align-items:baseline;gap:8px;
    pointer-events:none;
  }
  #era .yr{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
  #era .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Timeline scroll ---------- */
  #timeline{
    position:absolute;inset:0;z-index:10;
    overflow:auto;-webkit-overflow-scrolling:touch;
    padding-top:var(--top-pad,150px);
  }
  #timeline::-webkit-scrollbar{width:11px;height:11px}
  #timeline::-webkit-scrollbar-thumb{background:rgba(232,192,90,.3);border-radius:8px}
  #timeline::-webkit-scrollbar-track{background:transparent}

  #stage{display:flex;align-items:flex-start;min-width:min-content;padding:0 26px 160px}

  /* Ruler */
  #ruler{position:sticky;left:0;z-index:20;flex:0 0 var(--ruler-w);align-self:stretch}
  #ruler .inner{position:relative;width:100%}
  .tick{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line-soft)}
  .tick.major{border-top:1px solid var(--line)}
  .tick .t-lbl{
    position:absolute;right:8px;top:-8px;font-size:11px;color:var(--gold-dim);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .tick.major .t-lbl{color:var(--gold);font-size:12px;font-weight:500}
  #nowline{position:absolute;left:0;right:0;border-top:1px dashed rgba(232,192,90,.5)}
  #nowline .t-lbl{position:absolute;right:8px;top:-8px;font-size:11px;color:var(--gold)}

  /* Lanes */
  #lanes{display:flex;gap:0;align-items:flex-start;position:relative}
  .lane{position:relative;flex:1 1 0;border-left:1px solid var(--line-soft)}
  .lane.hidden{display:none}
  #lanes.overview .lane{min-width:120px;max-width:170px}
  #lanes.focus .lane{min-width:360px}
  #lanes.focus.solo .lane{min-width:520px}

  .lane-head{
    position:sticky;top:0;z-index:15;height:var(--head-h);
    display:flex;flex-direction:column;justify-content:center;gap:2px;
    padding:0 30px 0 14px;overflow:hidden;cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .lane-head .art{position:absolute;inset:-14px 0;background-size:cover;background-position:center;opacity:.45;z-index:0;
    scale:1.15;translate:0 var(--par,0px)}
  .lane-head .veil{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(16,14,11,.55), var(--shade));transition:opacity .3s}
  .lane-head:hover .veil{opacity:.7}
  .lane-head .nm{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.05;position:relative;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .lane-head .rg{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.85;position:relative;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .lane-head .accent{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;z-index:3}
  .story-i{position:absolute;top:8px;right:8px;z-index:3;width:18px;height:18px;border-radius:50%;
    border:1px solid currentColor;display:grid;place-items:center;
    font:italic 600 12px/1 var(--serif);opacity:.85}

  .lane-body{position:relative;margin-top:6px}

  /* spine: a thin line with light flowing down it, so each lane reads as a river */
  .spine{position:absolute;top:0;bottom:0;left:25px;width:3px;border-radius:2px;
    background:linear-gradient(180deg,transparent, var(--line) 2%, var(--line) 98%, transparent);overflow:hidden}
  .spine::after{content:'';position:absolute;inset:0;opacity:.75;
    background:linear-gradient(180deg, transparent 0%, var(--c) 45%, #fff6 50%, var(--c) 55%, transparent 100%) 0 0/100% 420px repeat-y}

  /* period band: a slim colored rail + wrapping label */
  .period{position:absolute;left:14px;right:8px;border-radius:6px}
  .period .p-rail{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:3px;transform-origin:top}
  .period .p-lbl{
    position:absolute;top:4px;left:13px;right:6px;font-size:10.5px;letter-spacing:.03em;
    color:var(--ink);opacity:.92;font-weight:600;line-height:1.15;
    text-transform:uppercase;white-space:normal;
  }
  #lanes.overview .period .p-lbl{font-size:9px;left:11px;letter-spacing:0}

  /* events */
  .event{position:absolute;left:0;right:0}
  .ev-dot{
    position:absolute;left:20px;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--bg);cursor:pointer;transition:transform .15s;z-index:3;
    top:-7px;
  }
  .ev-dot::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid currentColor;opacity:0}
  .ev-dot:hover{transform:scale(1.35)}
  .ev-card{
    margin-left:52px;margin-right:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line-soft);border-radius:11px;padding:12px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    transition:transform .5s var(--ease), border-color .25s, box-shadow .25s;
  }
  .ev-card:hover{border-color:var(--hl,var(--line));box-shadow:0 10px 34px rgba(0,0,0,.45), 0 0 0 1px var(--hl,transparent)}
  .ev-yr{font-family:var(--serif);color:var(--gold);font-size:17px;font-weight:600;line-height:1}
  .ev-ttl{font-size:14px;font-weight:600;margin:4px 0 5px;color:var(--ink)}
  .ev-desc{font-size:12.5px;line-height:1.5;color:var(--muted);font-weight:300}
  .ev-more{font-size:11px;color:var(--gold-dim);margin-top:6px;letter-spacing:.04em}
  /* the image box always reserves its height so card heights are stable for packing */
  .ev-media{margin-top:10px;height:150px;border-radius:8px;overflow:hidden;background:#0d0b09;border:1px solid var(--line-soft)}
  .ev-img{width:100%;height:100%;object-fit:cover;display:block;transition:scale .8s var(--ease), filter .3s}
  .ev-card:hover .ev-img{scale:1.06;filter:brightness(1.08)}
  .ev-cap{font-size:10px;color:var(--gold-dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* connector drawn when a card is pushed down off its true date by collision packing */
  .ev-conn{position:absolute;left:26px;top:0;width:2px;display:none;z-index:1;transform-origin:top;
    background:linear-gradient(180deg, var(--line), transparent)}

  /* "How it began" card at the top of each lane */
  .origin-card{border-color:var(--hl);background:linear-gradient(180deg,#241c14,var(--panel))}
  .origin-card .o-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  .origin-card .o-txt{font-size:12.5px;line-height:1.5;color:var(--ink);font-weight:300;margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

  /* Overview (3+ civilizations): compact image thumbnails so pictures stay visible */
  #lanes.overview .ev-card{margin-left:12px;margin-right:6px;padding:5px 6px;border-radius:8px}
  #lanes.overview .ev-ttl,#lanes.overview .ev-desc,#lanes.overview .ev-more,
  #lanes.overview .ev-cap,#lanes.overview .o-txt{display:none}
  #lanes.overview .ev-yr{font-size:12px}
  #lanes.overview .ev-media{height:62px;margin-top:4px}
  #lanes.overview .ev-dot{left:1px;width:9px;height:9px;top:-4px}
  #lanes.overview .ev-conn{left:5px}
  #lanes.overview .origin-card .o-lbl{font-size:8.5px;letter-spacing:.08em}
  #lanes.overview .story-i{display:none}
  #lanes.overview .lane-head{padding-right:8px}
  #lanes.overview .lane-head .nm{overflow-wrap:anywhere}

  /* overview hover tooltip */
  #tip{
    position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;
    background:rgba(20,16,12,.97);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;max-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #tip .ty{color:var(--gold);font-size:12px;font-weight:600;font-family:var(--serif)}
  #tip .tt{font-size:12px;color:var(--ink);margin-top:2px}

  /* detail drawer: used for both an event and a whole civilization's story */
  #drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:70;
    background:linear-gradient(180deg,#1a1510,#120f0b);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .45s cubic-bezier(.6,.02,.2,1);
    box-shadow:-20px 0 60px rgba(0,0,0,.5);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #drawer.open{transform:none}
  #drawer .d-top{padding:22px 24px 14px;border-bottom:1px solid var(--line-soft);position:relative}
  #drawer .d-close{position:absolute;top:12px;right:12px;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;
    background:none;border:0;padding:6px 10px;font-family:var(--sans)}
  #drawer .d-close:hover{color:var(--gold)}
  #drawer .d-civ{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;padding-right:36px}
  #drawer .d-yr{font-family:var(--serif);font-size:34px;color:var(--gold);line-height:1}
  #drawer .d-ttl{font-size:18px;font-weight:600;margin-top:6px;text-wrap:balance}
  #drawer .d-body{padding:20px 24px 32px;overflow:auto;flex:1}
  #drawer .d-img{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#0d0b09;border:1px solid var(--line-soft);display:block}
  #drawer .d-cap{font-size:11px;color:var(--muted);margin:8px 0 16px}
  #drawer .d-text p{font-size:14px;line-height:1.65;color:var(--ink);font-weight:300;margin:0 0 12px;max-width:62ch}
  #drawer .d-text h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:18px 0 6px;color:var(--gold)}
  #drawer .d-link{display:inline-block;margin-top:6px;font-size:13px}
  #drawer .moments{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
  #drawer .moments button{all:unset;cursor:pointer;display:grid;grid-template-columns:86px 1fr;gap:10px;
    padding:7px 8px;border-radius:7px;font-size:13px;line-height:1.35;width:100%;box-sizing:border-box}
  #drawer .moments button:hover,#drawer .moments button:focus-visible{background:rgba(232,192,90,.08)}
  #drawer .moments .m-yr{font-family:var(--serif);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:30;pointer-events:none;
    text-align:center;font-size:11px;color:var(--muted);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(16,14,11,.9),transparent);
  }

  /* intro: plays once, then lifts to reveal the timeline */
  #intro{
    position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 40%, #1c1610, #0c0a08);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:opacity .9s ease, visibility .9s;padding:24px;cursor:pointer;
  }
  #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  #intro h2{font-family:var(--serif);font-size:clamp(34px,7vw,64px);color:var(--gold);margin:0;font-weight:600;letter-spacing:.03em}
  #intro h2 span{display:inline-block}
  #intro p{color:var(--muted);max-width:520px;line-height:1.7;margin:16px 0 0;font-weight:300}
  #intro .skip{margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim)}

  /* ---------- Motion (only when the viewer hasn't asked for less) ---------- */
  @media (prefers-reduced-motion: no-preference){
    .spine::after{animation:flow 7s linear infinite}
    .ev-dot::after{animation:ping 3.6s ease-out infinite;animation-delay:var(--d,0s)}
    .lane-head .art{animation:drift 24s ease-in-out infinite alternate}
    .event,.period{transition:top .6s var(--ease), height .6s var(--ease)}
    .ev-card.seen{animation:cardIn .7s var(--ease) both}
    .ev-conn{animation:grow .5s var(--ease) both}

    #intro h2 span{animation:rise .9s var(--ease) both;animation-delay:calc(var(--k) * 45ms + .1s)}
    #intro p{animation:fadeUp 1s var(--ease) .8s both}
    #intro .skip{animation:fadeUp 1s var(--ease) 1.4s both}

    body.entering .lane{animation:laneIn .9s var(--ease) both;animation-delay:calc(var(--i) * 110ms)}
    body.entering .p-rail{animation:grow 1.4s var(--ease) both;animation-delay:calc(var(--i) * 110ms + .35s)}
    body.entering #ruler{animation:fadeUp .9s var(--ease) both}
    .lane.pop{animation:laneIn .55s var(--ease) both}

    #drawer.open .d-anim>*{animation:fadeUp .55s var(--ease) both}
    #drawer.open .d-anim>*:nth-child(2){animation-delay:.06s}
    #drawer.open .d-anim>*:nth-child(3){animation-delay:.12s}
    #drawer.open .d-anim>*:nth-child(4){animation-delay:.18s}
    #drawer.open .d-anim>*:nth-child(n+5){animation-delay:.24s}
  }
  @keyframes flow{to{background-position:0 420px}}
  @keyframes ping{0%{scale:.6;opacity:.7}70%,100%{scale:1.9;opacity:0}}
  @keyframes drift{from{scale:1.15}to{scale:1.28}}
  @keyframes cardIn{from{opacity:.2;translate:0 22px}to{opacity:1;translate:0 0}}
  @keyframes grow{from{scale:1 0}to{scale:1 1}}
  @keyframes rise{from{opacity:0;translate:0 .5em;filter:blur(6px)}to{opacity:1;translate:0 0;filter:blur(0)}}
  @keyframes fadeUp{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
  @keyframes laneIn{from{opacity:0;translate:0 60px}to{opacity:1;translate:0 0}}

  /* ---------- Mobile / small screens ---------- */
  @media (max-width:680px){
    :root{--ruler-w:52px}
    header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 18px}
    h1{font-size:19px}
    h1 .sub{display:none}
    .controls{gap:10px;margin-top:9px}
    .chip{font-size:12px;padding:5px 10px}
    .sep{display:none}
    .zoom{font-size:11px}
    #era .yr{font-size:18px}
    #era .lbl{max-width:120px;letter-spacing:.08em}
    #stage{padding:0 12px 120px}
    .lane-head .nm{font-size:16px}
    .lane-head .rg{font-size:9.5px}
    #lanes.focus .lane{min-width:78vw}
    #lanes.focus.solo .lane{min-width:84vw}
    #lanes.overview .lane{min-width:92px;max-width:120px}
    .ev-card{margin-left:44px}
    .ev-media{height:130px}
    .ev-dot{width:16px;height:16px;top:-8px}
    footer{font-size:10px}
    footer .f-more{display:none}
  }
  @media (max-width:680px) and (hover:none){
    .ev-dot{width:18px;height:18px;top:-9px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<header>
  <div class="title-row">
    <h1>Rivers of Time<span class="sub">civilizations in parallel</span></h1>
    <div id="era" aria-live="off"><span class="yr">—</span><span class="lbl"></span></div>
    <button id="collapseBtn" class="collapse-btn" title="Hide or show the filters">Hide filters ▲</button>
  </div>
  <div class="controls">
    <div class="chip-wrap" id="chips"></div>
    <div class="sep"></div>
    <button class="btn" id="allBtn">All</button>
    <button class="btn" id="noneBtn">Clear</button>
    <div class="sep"></div>
    <label class="zoom" for="zoom">Zoom
      <input type="range" id="zoom" min="0.45" max="6" step="0.05" value="0.7">
    </label>
    <button class="btn" id="spaceBtn" title="Switch between even spacing and spacing by number of years">Even spacing</button>
    <div class="sep"></div>
    <label class="toggle" for="imgToggle" title="On: real photos, with AI art where there is none. Off: AI-generated art only."><input type="checkbox" id="imgToggle" checked> Real photos</label>
  </div>
</header>

<div id="timeline">
  <div id="stage">
    <div id="ruler"><div class="inner" id="rulerInner"></div></div>
    <div id="lanes"></div>
  </div>
</div>

<div id="tip"><div class="ty"></div><div class="tt"></div></div>

<aside id="drawer" aria-hidden="true">
  <div class="d-top">
    <button class="d-close" id="dClose" aria-label="Close">&times;</button>
    <div class="d-civ" id="dCiv"></div>
    <div class="d-yr" id="dYr"></div>
    <div class="d-ttl" id="dTtl"></div>
  </div>
  <div class="d-body d-anim" id="dBody"></div>
</aside>

<footer>Tap a civilization’s name for its story<span class="f-more"> · 4000&nbsp;BCE → today · photos: Wikimedia Commons contributors; AI art fills the gaps</span></footer>

<div id="intro" role="dialog" aria-label="Rivers of Time">

/* ---- The story of each civilization: how it began, its land, peak, fall and legacy ---- */
const STORY = {
  meso:{ start:-4000,
    origin:'Farmers had irrigated the plain between the Tigris and Euphrates since about 6000 BCE. Around 4000 BCE their villages grew into temple towns, and Uruk became the first true city, with tens of thousands of people, full-time priests, craftsmen and scribes.',
    land:'A flat, hot river plain with little rain, stone or timber. Everything depended on canals that carried river water to the fields, and on trade for metal and wood.',
    peak:'Sumerian city-states invented writing, the wheel, the 60-minute hour and written law. Akkad, Babylon and Assyria each built empires on that foundation.',
    fall:'After Persia took Babylon in 539 BCE the region was ruled by outsiders for centuries. It revived as the heart of the Abbasid Caliphate before the Mongol sack of 1258.',
    legacy:'Writing, cities, the 360-degree circle, the seven-day week and some of the oldest stories in the world, such as the Epic of Gilgamesh.' },
  egypt:{ start:-4000,
    origin:'As North Africa dried out after about 5000 BCE, people moved into the narrow Nile valley, where the yearly flood left fresh black soil. Rival chiefdoms in Upper and Lower Egypt grew richer, until around 3100 BCE a ruler of the south, remembered as Narmer, united the two lands.',
    land:'A thin green strip along the Nile, with desert on both sides. The flood was so regular that Egyptians built their calendar around it.',
    peak:'The Old Kingdom built the pyramids; the New Kingdom of Hatshepsut, Akhenaten and Ramesses II stretched from Sudan to Syria.',
    fall:'Libyan, Nubian, Assyrian and Persian rulers took turns after 1000 BCE. Alexander arrived in 332 BCE, and Cleopatra’s death in 30 BCE made Egypt a Roman province.',
    legacy:'Monumental stone architecture, the 365-day calendar, papyrus and an alphabet whose signs passed, through Phoenician, into ours.' },
  indus:{ start:-3300,
    origin:'Farming villages appeared at Mehrgarh, west of the Indus, by 7000 BCE. Over thousands of years they spread onto the river plains, and by about 2600 BCE they had become large planned cities such as Harappa and Mohenjo-daro.',
    land:'The floodplains of the Indus and the now-dry Ghaggar-Hakra river, in today’s Pakistan and north-west India. Monsoon rains and snowmelt from the Himalaya fed the rivers.',
    peak:'More than a thousand settlements shared standard bricks, weights and seals. The cities had grid streets, covered drains and private bathrooms, with no sign of palaces or great temples.',
    fall:'From about 1900 BCE the cities shrank, probably as the monsoon weakened and rivers moved. People spread east into smaller villages. India’s later empires, from the Maurya to the Mughals, grew from this land.',
    legacy:'Urban planning and sanitation far ahead of their time. Their script is still undeciphered.' },
  china:{ start:-2070,
    origin:'Millet farmers settled the Yellow River valley by 7000 BCE and rice farmers the Yangtze. Neolithic cultures such as Yangshao and Longshan grew into walled towns, and the bronze-age city at Erlitou (about 1900 BCE) is often linked with the first dynasty, the Xia.',
    land:'The loess plains of the Yellow River in the north and the wetter Yangtze valley in the south, cut off from other early civilizations by mountains, deserts and sea.',
    peak:'The Han and Tang dynasties ran some of the largest and richest states on earth, with exams for officials, paper, printing and the Silk Road.',
    fall:'Dynasties rose and fell in a long cycle for over 3,000 years. Imperial rule ended in 1912; China then became a republic and, from 1949, the People’s Republic.',
    legacy:'The longest continuous written tradition in the world, along with paper, printing, the compass, gunpowder and Confucian ideas of government.' },
  greece:{ start:-2000,
    origin:'Bronze-age palaces grew on Crete (the Minoans, from about 2000 BCE) and then on the mainland at Mycenae. After those palaces collapsed around 1100 BCE, Greek communities slowly rebuilt as independent city-states and adopted the Phoenician alphabet.',
    land:'Rocky peninsulas and hundreds of islands, with little farmland. The sea was the main road, so Greeks became traders and colonists from Spain to the Black Sea.',
    peak:'Classical Athens in the 400s BCE produced democracy, the Parthenon, drama and philosophy. Alexander then carried Greek culture as far as India.',
    fall:'Rome conquered Greece by 146 BCE, but Greek remained the language of the eastern Mediterranean and of the Byzantine Empire until 1453.',
    legacy:'Democracy, philosophy, theatre, history-writing, geometry and the Olympic Games.' },
  rome:{ start:-753,
    origin:'Latin-speaking villages on hills beside the Tiber merged into a town by the 700s BCE; legend says Romulus founded it in 753 BCE. Its Etruscan kings were thrown out in 509 BCE and the Romans set up a republic.',
    land:'Central Italy, at a river crossing on the main route between Etruria and the south. From there Rome expanded to control the whole Mediterranean.',
    peak:'Around 117 CE, under Trajan, the empire ran from Scotland to Iraq, linked by roads, aqueducts and one law.',
    fall:'The western empire broke up under civil war, economic strain and migrating peoples, ending in 476 CE. The eastern half, Byzantium, lasted until 1453.',
    legacy:'Roman law, the Latin alphabet, the Romance languages, concrete, the calendar and the Catholic Church.' },
  persia:{ start:-550,
    origin:'Iranian-speaking peoples moved onto the Iranian plateau around 1000 BCE. The Medes built a kingdom there, and in 550 BCE Cyrus, a Persian vassal king, overthrew them and began the Achaemenid Empire.',
    land:'A high plateau ringed by mountains, from the Zagros to the Hindu Kush. It sits on the land routes between Mesopotamia, India and Central Asia.',
    peak:'Under Darius I the Achaemenid Empire ruled about 44% of the world’s people, with a royal road, coinage and local self-rule for many peoples.',
    fall:'Alexander ended the Achaemenids in 330 BCE, but Persian empires returned under the Parthians and Sasanians until the Arab conquest of 651 CE.',
    legacy:'A model of tolerant multi-ethnic empire, Zoroastrianism, Persian poetry and art, and a language that is still spoken in Iran today.' },
  meso_am:{ start:-1500,
    origin:'People in Mexico domesticated maize, beans and squash between about 7000 and 3000 BCE. Farming villages on the Gulf Coast became the first Olmec ceremonial centres around 1500 BCE.',
    land:'A varied land of tropical lowlands, highland valleys and volcanoes, from central Mexico to Honduras, with no draft animals and no wheeled carts.',
    peak:'Classic Maya cities (250–900 CE) and huge Teotihuacan had writing, an accurate calendar and a concept of zero. The Aztec capital Tenochtitlan later held about 200,000 people.',
    fall:'Many Maya cities emptied after 900 CE. The Aztec Empire fell to Spanish forces and their native allies in 1521, and disease killed most of the population.',
    legacy:'Maize, chocolate, tomatoes and chilli, the Maya calendar and writing, and the Indigenous cultures of modern Mexico and Central America.' },
  andes:{ start:-3000,
    origin:'At Caral, near the Peruvian coast, people built pyramids and plazas around 3000 BCE, about when Egypt was unified. They lived on fish and cotton, and Caral is the oldest known city in the Americas.',
    land:'A dry coastal desert, steep river valleys and high mountain plateaus, all within a few hundred kilometres. People farmed on terraces and herded llamas and alpacas.',
    peak:'The Inca Empire of the 1400s ran 4,000 km along the Andes, with about 40,000 km of roads, and kept records on knotted cords called khipu.',
    fall:'Civil war and smallpox weakened the Inca just before Pizarro arrived. Spain took Cusco in 1533; Peru became independent in 1821.',
    legacy:'Potatoes, quinoa, terrace farming, freeze-dried food, superb stonework and the Quechua language, still spoken by millions.' }
};

const MORE = {
  'First cities & writing':'Writing began as bookkeeping: tokens and pictures pressed into clay to record grain, beer and sheep owed to the temple. Within a few centuries scribes were using the same wedge-shaped signs to write laws, letters and poetry.',
  'Code of Hammurabi':'The 2.25-metre stele lists 282 laws, from building standards to divorce. Penalties depended on social class, but the king presented the code as protection for the weak against the strong.',
  'Unification under Narmer':'The Narmer Palette shows the king wearing the white crown of the south on one side and the red crown of the north on the other. Pharaohs wore the double crown ever after.',
  'Great Pyramid of Giza':'Built for Khufu around 2560 BCE from about 2.3 million blocks, it was the tallest building on earth for nearly 4,000 years. Workers’ villages nearby show it was built by paid, organised crews, not slaves.',
  'Tutankhamun':'A minor king who died at about 19. He is famous because Howard Carter found his tomb almost untouched in 1922, with more than 5,000 objects inside.',
  'The Rosetta Stone':'The same decree is written in hieroglyphs, Demotic and Greek. Using the Greek as a key, Jean-François Champollion deciphered hieroglyphs in 1822.',
  'Mohenjo-daro & Harappa':'Mohenjo-daro may have held 40,000 people. Almost every house had a bathing area connected to covered street drains, a level of sanitation many cities did not reach again until the 1800s.',
  'Qin unifies China':'Qin Shi Huang standardised writing, coins, weights and axle widths, and linked older border walls. More than 8,000 life-size clay soldiers guard his tomb.',
  'Athenian democracy':'Citizens voted directly in the Assembly and many offices were filled by lottery. Women, slaves and foreigners, most of the population, could not take part.',
  'Alexander the Great':'In just 13 years Alexander conquered from Greece to India and founded about 20 cities named Alexandria. He died in Babylon at 32.',
  'Fall of Western Rome':'In 476 the general Odoacer deposed the boy emperor Romulus Augustulus and did not appoint a new one. Few people at the time saw it as the end of an era.',
  'Cyrus & the Achaemenids':'Cyrus let peoples keep their own gods and customs. The Cyrus Cylinder records him allowing deported peoples, including the Jews in Babylon, to return home.',
  'The Inca Empire':'The Inca called their empire Tawantinsuyu, “the four parts together”. Relay runners carried messages along the roads up to 240 km a day.',
  'Founding of Tenochtitlan':'Aztec legend says they were told to settle where they saw an eagle on a cactus. That image is now on Mexico’s flag.'
};

/* ============================================================ STATE */
const T_MIN = -4000, T_MAX = 2025;
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let scaleMul = 0.7;      // global vertical zoom multiplier
let evenMode = true;     // true = adaptive even spacing, false = proportional (by years)
let anchors=[], segH=[], cum=[];   // shared piecewise-linear time scale
let selected = new Set(CIVS.map(c=>c.id));
let photosOn = true;     // prefer real photos; off = AI art first

const lanesEl = document.getElementById('lanes');
const rulerInner = document.getElementById('rulerInner');
const timeline = document.getElementById('timeline');

let topPad = 150;
function layout(){
  const h = document.querySelector('header').offsetHeight;
  topPad = h + 12;
  document.documentElement.style.setProperty('--top-pad', topPad+'px');
}

function fmtYear(y){
  y = Math.round(y);
  if(y<0) return Math.abs(y)+' BCE';
  if(y===0) return '1 CE';
  return y+' CE';
}
function hex(c,a){ const n=parseInt(c.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

/* ---------- Adaptive shared time scale ----------
   All lanes share one monotonic year→pixel map, so "same row = same year" holds.
   Even mode gives every gap between anchor years a similar height (kills dead space,
   spreads clusters); Proportional mode makes height ∝ years (true linear). */
function clampYr(y){ return Math.max(T_MIN, Math.min(T_MAX, y)); }
function buildScale(){
  const set=new Set([T_MIN,T_MAX]);
  CIVS.forEach(c=>{
    set.add(clampYr(c.start));
    c.periods.forEach(p=>{ set.add(clampYr(p.s)); set.add(clampYr(p.e)); });
    c.events.forEach(e=>{ set.add(clampYr(e.y)); });
  });
  anchors=[...set].sort((a,b)=>a-b);
  segH=[];
  for(let i=0;i<anchors.length-1;i++){
    const gap=anchors[i+1]-anchors[i];
    segH.push( evenMode ? (46 + 9*Math.log1p(gap)) : gap );
  }
  cum=[0];
  for(let i=0;i<segH.length;i++) cum.push(cum[i]+segH[i]);
}
function segIndex(year){
  let a=0,b=anchors.length-1,k=0;
  while(a<=b){ const m=(a+b)>>1; if(anchors[m]<=year){k=m;a=m+1;} else b=m-1; }
  return Math.min(k, anchors.length-2);
}
function yPos(year){
  year=clampYr(year);
  const k=segIndex(year);
  const frac=(year-anchors[k])/(anchors[k+1]-anchors[k]);
  return (cum[k] + frac*segH[k]) * scaleMul;
}
function yearAt(y){
  const t=y/scaleMul, last=cum[cum.length-1];
  if(t<=0) return T_MIN; if(t>=last) return T_MAX;
  let a=0,b=cum.length-1,k=0;
  while(a<=b){ const m=(a+b)>>1; if(cum[m]<=t){k=m;a=m+1;} else b=m-1; }
  k=Math.min(k, segH.length-1);
  const frac=(t-cum[k])/segH[k];
  return anchors[k] + frac*(anchors[k+1]-anchors[k]);
}
function totalHeight(){ return cum[cum.length-1]*scaleMul; }

/* ---------- Images: bundled with the page (img/), never fetched from other sites ---------- */
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const AI_SET=new Set(IMG.ai);
function banner(c){ return AI_SET.has('civ-'+c.id) ? 'img/ai/civ-'+c.id+'.jpg' : ''; }
function eventImage(ev, c){
  const key=slug(ev.wiki), cr=IMG.wiki[key];
  const photo = cr ? {src:'img/wiki/'+key+'.jpg', photo:true, cr} : null;
  const aiKey = c.id+'-'+ev._i;
  const art = AI_SET.has(aiKey) ? {src:'img/ai/'+aiKey+'.jpg'} : (banner(c) ? {src:banner(c)} : null);
  return photosOn ? (photo||art) : (art||photo);
}
function caption(im){
  if(!im) return '';
  if(!im.photo) return 'AI-generated impression';
  const who=[im.cr.a, im.cr.l].filter(Boolean).join(' · ');
  return 'Photo' + (who ? ': '+who : '');
}
function wikiUrl(title){ return 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_')); }

/* ---------------- Chips ---------------- */
const chipsEl = document.getElementById('chips');
CIVS.forEach(c=>{
  const b = el('button','chip on');
  b.dataset.id=c.id; b.type='button';
  b.style.background=c.color;
  const d=el('span','dot'); d.style.background=c.color;
  b.append(d, document.createTextNode(c.name));
  b.addEventListener('click', ()=>toggleCiv(c.id));
  chipsEl.appendChild(b);
});
function refreshChips(){
  [...chipsEl.children].forEach(b=>{
    const on = selected.has(b.dataset.id);
    const c = CIVS.find(x=>x.id===b.dataset.id);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    b.style.background = on ? c.color : 'rgba(255,255,255,.02)';
  });
}
function toggleCiv(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  applySelection();
}
document.getElementById('allBtn').onclick = ()=>{ selected = new Set(CIVS.map(c=>c.id)); applySelection(); };
document.getElementById('noneBtn').onclick = ()=>{ selected = new Set(); applySelection(); };

function applySelection(){
  refreshChips();
  CIVS.forEach(c=>{
    const lane = document.getElementById('lane-'+c.id);
    if(!lane) return;
    const wasHidden = lane.classList.contains('hidden');
    const hide = !selected.has(c.id);
    lane.classList.toggle('hidden', hide);
    if(wasHidden && !hide){ lane.classList.remove('pop'); void lane.offsetWidth; lane.classList.add('pop'); }
  });
  const n = selected.size;
  lanesEl.classList.toggle('focus', n>0 && n<=2);
  lanesEl.classList.toggle('overview', n>2);
  lanesEl.classList.toggle('solo', n===1);
  requestAnimationFrame(()=>{ resolveCollisions(); checkReveal(); updateEra(); });
}
lanesEl.addEventListener('animationend', e=>{ if(e.target.classList.contains('pop')) e.target.classList.remove('pop'); });

/* ---------------- Ruler ---------------- */
function buildRuler(){
  rulerInner.innerHTML='';
  rulerInner.style.height = totalHeight()+'px';
  for(let y=T_MIN; y<=T_MAX; y+=500){
    const major = (y%1000===0);
    const t=el('div','tick'+(major?' major':''));
    t.style.top = yPos(y)+'px';
    if(major) t.appendChild(el('div','t-lbl',fmtYear(y)));
    rulerInner.appendChild(t);
  }
  const now=el('div'); now.id='nowline'; now.style.top=yPos(T_MAX)+'px';
  now.appendChild(el('div','t-lbl','today'));
  rulerInner.appendChild(now);
}

/* ---------------- Lanes ---------------- */
function fillMedia(card, im, alt){
  let media=card.querySelector('.ev-media'), cap=card.querySelector('.ev-cap');
  if(!im){ if(media) media.remove(); if(cap) cap.remove(); return; }
  if(!media){
    media=el('div','ev-media');
    const img=el('img','ev-img'); img.alt=alt; img.loading='lazy'; img.decoding='async';
    media.appendChild(img); card.appendChild(media);
    cap=el('div','ev-cap'); card.appendChild(cap);
  }
  media.firstChild.src=im.src;
  if(cap) cap.textContent=caption(im);
}

function buildLanes(){
  lanesEl.innerHTML='';
  CIVS.forEach((c,ci)=>{
    const lane=el('div','lane'); lane.id='lane-'+c.id;
    lane.style.setProperty('--i', ci);
    lane.style.setProperty('--c', c.color);
    lane.style.setProperty('--hl', hex(c.color,.55));

    const head=el('div','lane-head');
    head.tabIndex=0; head.setAttribute('role','button');
    head.setAttribute('aria-label','Read the story of '+c.name);
    if(banner(c)){ const art=el('div','art'); art.style.backgroundImage=`url('${banner(c)}')`; head.appendChild(art); }
    head.appendChild(el('div','veil'));
    const acc=el('div','accent'); acc.style.background=c.color; head.appendChild(acc);
    const nm=el('div','nm',c.name); nm.style.color=c.color; head.appendChild(nm);
    head.appendChild(el('div','rg',c.region));
    const si=el('span','story-i','i'); si.style.color=c.color; si.setAttribute('aria-hidden','true'); head.appendChild(si);
    head.addEventListener('click',()=>openCivDrawer(c));
    head.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCivDrawer(c); } });
    lane.appendChild(head);

    const body=el('div','lane-body');
    body.style.height=totalHeight()+'px';
    body.appendChild(el('div','spine'));

    // periods
    c.periods.forEach((p,i)=>{
      const s=Math.max(p.s,T_MIN), e=Math.min(p.e,T_MAX);
      const h=yPos(e)-yPos(s);
      const band=el('div','period');
      band.style.top=yPos(s)+'px';
      band.style.height=h+'px';
      band.style.background=`linear-gradient(90deg, ${hex(c.color,.10)}, ${hex(c.color,.02)} 45%, transparent)`;
      const rail=el('div','p-rail'); rail.style.background=hex(c.color, i%2?0.55:0.85);
      const lbl=el('div','p-lbl',p.name); if(h<24) lbl.hidden=true;
      band.append(rail,lbl);
      body.appendChild(band);
    });

    // "How it began" card, pinned at the civilization's first year
    const ow=el('div','event origin-wrap'); ow.style.top=yPos(c.start)+'px';
    const oc=el('div','ev-card origin-card');
    oc.setAttribute('role','button'); oc.tabIndex=0;
    const ol=el('div','o-lbl','How it began'); ol.style.color=c.color;
    const oy=el('div','ev-yr',fmtYear(c.start)); oy.style.color=c.color;
    oc.append(ol, oy, el('div','o-txt',c.origin), el('div','ev-more','Read the full story →'));
    if(banner(c)) fillMedia(oc,{src:banner(c)},'');
    if(oc.querySelector('.ev-cap')) oc.querySelector('.ev-cap').remove();
    oc.addEventListener('click',()=>openCivDrawer(c));
    oc.addEventListener('keydown',e=>{ if(e.key==='Enter'){ openCivDrawer(c); } });
    ow.appendChild(oc);
    body.appendChild(ow);

    // events
    c.events.forEach((ev,i)=>{
      ev._i=i;
      const wrap=el('div','event'); wrap.style.top=yPos(ev.y)+'px';

      const dot=el('div','ev-dot');
      dot.style.background=c.color; dot.style.color=c.color;
      dot.style.boxShadow=`0 0 12px ${hex(c.color,.7)}`;
      dot.style.setProperty('--d', (Math.random()*3.6).toFixed(2)+'s');
      dot.addEventListener('mouseenter',e=>showTip(e,ev,c));
      dot.addEventListener('mousemove',moveTip);
      dot.addEventListener('mouseleave',hideTip);
      dot.addEventListener('click',()=>openDrawer(ev,c));
      wrap.appendChild(dot);

      const card=el('div','ev-card');
      card.setAttribute('role','button'); card.tabIndex=0;
      const yr=el('div','ev-yr',fmtYear(ev.y)); yr.style.color=c.color;
      card.append(yr, el('div','ev-ttl',ev.t), el('div','ev-desc',ev.d));
      if(ev.more) card.appendChild(el('div','ev-more','Read more →'));
      fillMedia(card, eventImage(ev,c), ev.t);
      card.addEventListener('click',()=>openDrawer(ev,c));
      card.addEventListener('keydown',e=>{ if(e.key==='Enter') openDrawer(ev,c); });
      ev._card=card;
      wrap.appendChild(card);
      body.appendChild(wrap);
    });

    lane.appendChild(body);
    lanesEl.appendChild(lane);
  });
}

/* Cards are always visible; as each one comes into view it plays a short entrance. */
function checkReveal(){
  const vh=window.innerHeight;
  document.querySelectorAll('.lane:not(.hidden) .ev-card:not(.seen)').forEach(card=>{
    const r=card.getBoundingClientRect();
    if(r.top<vh-30 && r.bottom>60) card.classList.add('seen');
  });
}

/* ---------------- Tooltip (overview) ---------------- */
const tip=document.getElementById('tip');
function showTip(e,ev,c){
  if(!lanesEl.classList.contains('overview')) return;
  tip.querySelector('.ty').textContent=fmtYear(ev.y);
  tip.querySelector('.ty').style.color=c.color;
  tip.querySelector('.tt').textContent=ev.t;
  tip.style.opacity=1; moveTip(e);
}
function moveTip(e){
  const x=Math.min(e.clientX+14, window.innerWidth-260);
  tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px';
}
function hideTip(){ tip.style.opacity=0; }

/* ---------------- Drawer: an event, or a whole civilization's story ---------------- */
const drawer=document.getElementById('drawer'), dBody=document.getElementById('dBody');
function setHead(kicker, color, big, title){
  const k=document.getElementById('dCiv'); k.textContent=kicker; k.style.color=color;
  const y=document.getElementById('dYr'); y.textContent=big; y.style.color=color;
  document.getElementById('dTtl').textContent=title;
}
function showDrawer(){
  drawer.classList.remove('open'); void drawer.offsetWidth;   // restart the content stagger
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  dBody.scrollTop=0;
  document.getElementById('dClose').focus({preventScroll:true});
}
function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
function drawerImage(src, cap, alt){
  if(!src) return;
  const img=el('img','d-img'); img.src=src; img.alt=alt||'';
  dBody.append(img, el('div','d-cap',cap));
}
function openDrawer(ev,c){
  setHead(c.name+' · '+c.region, c.color, fmtYear(ev.y), ev.t);
  dBody.innerHTML='';
  const im=eventImage(ev,c);
  if(im) drawerImage(im.src, caption(im), ev.t);
  const txt=el('div','d-text');
  txt.appendChild(el('p',null,ev.d));
  if(ev.more) txt.appendChild(el('p',null,ev.more));
  dBody.appendChild(txt);
  const a=el('a','d-link','Read about this on Wikipedia →'); a.href=wikiUrl(im&&im.photo?im.cr.p:ev.wiki);
  a.target='_blank'; a.rel='noopener'; dBody.appendChild(a);
  showDrawer();
}
function openCivDrawer(c){
  const last=Math.max(...c.periods.map(p=>p.e));
  setHead(c.region, c.color, fmtYear(c.start)+' – '+(last>=T_MAX?'today':fmtYear(last)), c.name);
  dBody.innerHTML='';
  drawerImage(banner(c), 'AI-generated impression', c.name);
  const txt=el('div','d-text');
  [['How it began',c.origin],['The land',c.land],['Golden age',c.peak],['Decline and after',c.fall],['Legacy',c.legacy]]
    .forEach(([h,p])=>{ if(p){ txt.appendChild(el('h3',null,h)); txt.appendChild(el('p',null,p)); } });
  dBody.appendChild(txt);
  const h=el('div','d-text'); h.appendChild(el('h3',null,'Key moments')); dBody.appendChild(h);
  const ul=el('ul','moments');
  [...c.events].sort((a,b)=>a.y-b.y).forEach(ev=>{
    const li=el('li'), b=el('button');
    const y=el('span','m-yr',fmtYear(ev.y)); y.style.color=c.color;
    b.append(y, el('span',null,ev.t));
    b.addEventListener('click',()=>{ openDrawer(ev,c); scrollToEvent(ev); });
    li.appendChild(b); ul.appendChild(li);
  });
  dBody.appendChild(ul);
  showDrawer();
}
function scrollToEvent(ev){
  if(!ev._card || ev._card.offsetParent===null) return;
  const r=ev._card.getBoundingClientRect(), t=timeline.getBoundingClientRect();
  timeline.scrollBy({top:r.top-t.top-topPad-40, left:0, behavior:REDUCE?'auto':'smooth'});
}
document.getElementById('dClose').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------------- Era readout: the year eases toward the scroll position ---------------- */
const eraYr=document.querySelector('#era .yr'), eraLbl=document.querySelector('#era .lbl');
let eraShown=null, eraTarget=0, eraRaf=0;
function updateEra(){
  eraTarget = yearAt(timeline.scrollTop + timeline.clientHeight*0.42 - topPad);
  let label='';
  for(const c of CIVS){
    if(!selected.has(c.id)) continue;
    const p=c.periods.find(p=>eraTarget>=p.s&&eraTarget<=p.e);
    if(p){ label=c.name+' · '+p.name; break; }
  }
  eraLbl.textContent = label || 'along the shared timeline';
  if(REDUCE || eraShown===null){ eraShown=eraTarget; eraYr.textContent=fmtYear(eraShown); return; }
  if(!eraRaf) eraRaf=requestAnimationFrame(tickEra);
}
function tickEra(){
  eraShown += (eraTarget-eraShown)*0.2;
  if(Math.abs(eraTarget-eraShown)<0.6) eraShown=eraTarget;
  eraYr.textContent=fmtYear(eraShown);
  eraRaf = eraShown===eraTarget ? 0 : requestAnimationFrame(tickEra);
}

/* ---------------- Scroll wiring (reveal, readout, banner parallax) ---------------- */
let ticking=false;
timeline.addEventListener('scroll',()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    checkReveal(); updateEra();
    if(!REDUCE) lanesEl.style.setProperty('--par', (Math.sin(timeline.scrollTop/700)*10).toFixed(1)+'px');
    ticking=false;
  });
},{passive:true});

/* ---------------- Zoom and spacing ---------------- */
const zoomEl=document.getElementById('zoom');
function keepCenter(change){
  const centerYear = yearAt(timeline.scrollTop + timeline.clientHeight/2 - topPad);
  change();
  rebuildGeometry();
  timeline.scrollTop = yPos(centerYear) - timeline.clientHeight/2 + topPad;
  checkReveal(); updateEra();
}
zoomEl.addEventListener('input',()=>keepCenter(()=>{ scaleMul=parseFloat(zoomEl.value); }));
document.getElementById('spaceBtn').addEventListener('click',()=>keepCenter(()=>{
  evenMode=!evenMode;
  document.getElementById('spaceBtn').textContent = evenMode ? 'Even spacing' : 'By years';
  buildScale();
}));

function rebuildGeometry(){
  buildRuler();
  const h=totalHeight()+'px';
  document.querySelectorAll('.lane-body').forEach(b=>b.style.height=h);
  CIVS.forEach(c=>{
    const lane=document.getElementById('lane-'+c.id); if(!lane) return;
    const body=lane.querySelector('.lane-body');
    const bands=body.querySelectorAll('.period');
    c.periods.forEach((p,i)=>{
      const s=Math.max(p.s,T_MIN),e=Math.min(p.e,T_MAX);
      const bh=yPos(e)-yPos(s);
      bands[i].style.top=yPos(s)+'px';
      bands[i].style.height=bh+'px';
      const lbl=bands[i].querySelector('.p-lbl'); if(lbl) lbl.hidden = bh<24;
    });
    body.querySelector('.origin-wrap').style.top=yPos(c.start)+'px';
    const evs=body.querySelectorAll('.event:not(.origin-wrap)');
    c.events.forEach((ev,i)=>{ evs[i].style.top=yPos(ev.y)+'px'; });
  });
  requestAnimationFrame(resolveCollisions);
}

/* ---------------- Collision packing ----------------
   Cards that would overlap in a lane slide down off their true date, with a
   connector back to the dot (which stays on the real year). */
function resolveCollisions(){
  const GAP=8;
  CIVS.forEach(c=>{
    const lane=document.getElementById('lane-'+c.id);
    if(!lane || lane.classList.contains('hidden')) return;
    const events=[...lane.querySelectorAll('.event')]
      .sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top));
    let prevBottom=-1e9;
    events.forEach(wrap=>{
      const card=wrap.querySelector('.ev-card');
      const natTop=parseFloat(wrap.style.top)||0;
      const hgt=card.offsetHeight||60;
      let shift=0;
      if(natTop < prevBottom+GAP) shift=(prevBottom+GAP)-natTop;
      card.style.transform = shift>0 ? `translateY(${shift}px)` : '';
      let conn=wrap.querySelector('.ev-conn');
      if(shift>4){
        if(!conn){ conn=el('div','ev-conn'); wrap.insertBefore(conn, wrap.firstChild); }
        conn.style.height=shift+'px'; conn.style.display='block';
      } else if(conn){ conn.style.display='none'; }
      prevBottom = natTop + shift + hgt;
    });
  });
}

/* ---------------- Photos / AI art toggle ---------------- */
document.getElementById('imgToggle').addEventListener('change',e=>{
  photosOn=e.target.checked;
  CIVS.forEach(c=>c.events.forEach(ev=>{ if(ev._card) fillMedia(ev._card, eventImage(ev,c), ev.t); }));
  requestAnimationFrame(resolveCollisions);
});

/* ---------------- Gold dust background ---------------- */
(function(){
  const cv=document.getElementById('bg'), ctx=cv.getContext('2d');
  let W,H,parts=[],scrollP=0;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
    const n=Math.min(150, Math.floor(W*H/12000));
    parts=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.8+0.3, s:Math.random()*0.25+0.05,
      a:Math.random()*0.5+0.1, drift:(Math.random()-0.5)*0.15
    }));
  }
  timeline.addEventListener('scroll',()=>{ scrollP=timeline.scrollTop; },{passive:true});
  function draw(){
    ctx.clearRect(0,0,W,H);
    const off=(scrollP*0.03)%H;
    for(const p of parts){
      if(!REDUCE){ p.y-=p.s; p.x+=p.drift; }
      if(p.y<-5) p.y=H+5;
      if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5;
      let yy=(p.y-off); yy=((yy%H)+H)%H;
      ctx.beginPath(); ctx.arc(p.x,yy,p.r,0,6.283);
      ctx.fillStyle=`rgba(232,192,90,${p.a})`; ctx.fill();
    }
    if(!REDUCE) requestAnimationFrame(draw);
  }
  addEventListener('resize',()=>{ resize(); if(REDUCE) draw(); }); resize(); draw();
})();

/* ---------------- Collapse filters ---------------- */
document.getElementById('collapseBtn').addEventListener('click', ()=>{
  const hidden = document.body.classList.toggle('controls-hidden');
  document.getElementById('collapseBtn').textContent = hidden ? 'Filters ▼' : 'Hide filters ▲';
  layout(); updateEra(); requestAnimationFrame(checkReveal);
});

/* ---------------- Intro: title assembles, then the lanes flow in ---------------- */
const intro=document.getElementById('intro');
(function(){
  const h=document.getElementById('introTitle');
  const text=h.textContent; h.textContent='';
  [...text].forEach((ch,k)=>{ const s=el('span',null,ch===' '?' ':ch); s.style.setProperty('--k',k); h.appendChild(s); });
})();
let entered=false;
function enter(){
  if(entered) return; entered=true;
  intro.classList.add('gone');
  if(!REDUCE){
    document.body.classList.add('entering');
    setTimeout(()=>document.body.classList.remove('entering'), 2800);
  }
  setTimeout(()=>{ layout(); resolveCollisions(); checkReveal(); updateEra(); }, 60);
}
intro.addEventListener('click', enter);
document.addEventListener('keydown', e=>{ if(!entered && (e.key==='Enter'||e.key===' '||e.key==='Escape')) enter(); });

/* ---------------- Init ---------------- */
layout();
buildScale();
buildRuler();
buildLanes();
applySelection();
updateEra();
requestAnimationFrame(resolveCollisions);
setTimeout(()=>{ resolveCollisions(); checkReveal(); }, 300);
if(REDUCE) enter(); else setTimeout(enter, 2600);
let rz;
window.addEventListener('resize',()=>{ layout(); updateEra(); clearTimeout(rz); rz=setTimeout(()=>{ resolveCollisions(); checkReveal(); },140); });
window.addEventListener('orientationchange',()=>{ setTimeout(()=>{ layout(); updateEra(); resolveCollisions(); checkReveal(); },200); });
</script>
